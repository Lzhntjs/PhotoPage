<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Works — LucaLiu Photography</title>
  <meta name="description" content="Selected works — photography series by Luca Liu." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23F4F3EF'/><text x='16' y='22' font-family='Georgia,serif' font-size='18' fill='%232B2B28' text-anchor='middle'>L</text></svg>" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: {
        colors: { paper:'#F4F3EF','paper-2':'#ECEAE4', ink:'#2B2B28', muted:'#9A9A92', line:'#E0DED8' },
        fontFamily: { display:['Cormorant Garamond','serif'], body:['Inter','sans-serif'] }
      } }
    };
  </script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="font-body">

  <!-- 固定侧边栏布局 -->
  <div class="app-layout">
    <aside class="app-sidebar">
      <a href="index.html" class="sidebar-logo">LucaLiu Photography</a>
      <nav class="sidebar-nav">
        <div class="sidebar-col">
          <a href="index.html"  data-nav="home">Home</a>
          <a href="works.html"  data-nav="works">Works</a>
          <a href="stream.html" data-nav="stream">Stream</a>
          <a href="about.html"  data-nav="about">About</a>
        </div>
        <div class="sidebar-col sub-nav" id="sidebar-series-list">
          <!-- JS 动态注入作品系列列表 -->
        </div>
      </nav>
      <div class="sidebar-footer">&copy; <span data-year></span> Luca Liu</div>
    </aside>

    <!-- 汉堡菜单按钮（移动端） -->
    <button class="sidebar-toggle" data-sidebar-toggle aria-label="Toggle menu">Menu</button>

    <main class="app-main">
      <section class="pt-28 pb-12 px-6 sm:px-10 max-w-[var(--maxw)] mx-auto">
        <h1 class="reveal title text-4xl sm:text-6xl">Works</h1>
        <p class="reveal text-sm text-muted mt-3">Selected series, arranged by category.</p>
      </section>

      <!-- 作品总览：分类次级标题 + 系列封面列表 -->
      <section class="max-w-[var(--maxw)] mx-auto px-6 sm:px-10 pb-32">
        <div id="works-list" class="works-list"></div>
      </section>
    </main>
  </div>

  <script src="js/data.js?v=3"></script>
  <script src="js/lightbox.js?v=3"></script>
  <script src="js/app.js?v=3"></script>
  <script src="js/works.js?v=3"></script>
</body>
</html>
