<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stream — LucaLiu Photography</title>
  <meta name="description" content="All photographs by Luca Liu, in a single scroll." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23F4F3EF'/><text x='16' y='22' font-family='Georgia,serif' font-size='18' fill='%232B2B28' text-anchor='middle'>L</text></svg>" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: {
        colors: { paper:'#F4F3EF','paper-2':'#ECEAE4', ink:'#2B2B28', muted:'#9A9A92', line:'#E0DED8' },
        fontFamily: { display:['Cormorant Garamond','serif'], body:['Inter','sans-serif'] }
      } }
    };
  </script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="font-body">

  <header class="site-header">
    <div class="max-w-[var(--maxw)] mx-auto px-6 sm:px-10">
      <div class="flex items-center justify-between h-20">
        <a href="index.html" class="font-display tracking-wide-2 text-sm">
          <span class="block leading-none">LUCA LIU</span>
          <span class="block text-[10px] tracking-wide-3 text-muted mt-1">PHOTOGRAPHY</span>
        </a>
        <nav class="hidden sm:flex items-center gap-8 text-xs tracking-wide-2 uppercase">
          <a href="index.html"  data-nav="home"   class="link-quiet">Home</a>
          <a href="works.html"  data-nav="works"  class="link-quiet">Works</a>
          <a href="stream.html" data-nav="stream" class="link-quiet">Stream</a>
          <a href="about.html"  data-nav="about"  class="link-quiet">About</a>
        </nav>
        <button class="sm:hidden text-xl" data-menu-toggle aria-label="Menu">&#9776;</button>
      </div>
      <div class="mobile-menu sm:hidden" data-mobile-menu>
        <nav class="flex flex-col gap-5 pb-6 text-xs tracking-wide-2 uppercase">
          <a href="index.html"  data-nav="home"   class="link-quiet">Home</a>
          <a href="works.html"  data-nav="works"  class="link-quiet">Works</a>
          <a href="stream.html" data-nav="stream" class="link-quiet">Stream</a>
          <a href="about.html"  data-nav="about"  class="link-quiet">About</a>
        </nav>
      </div>
    </div>
  </header>

  <main>
    <section class="pt-28 pb-12 px-6 sm:px-10 max-w-[var(--maxw)] mx-auto">
      <h1 class="reveal title text-4xl sm:text-6xl">Stream</h1>
      <p class="reveal text-sm text-muted mt-3">All photographs, one continuous scroll.</p>
    </section>

    <section class="max-w-[var(--maxw)] mx-auto px-6 sm:px-10 pb-32">
      <div id="stream-root" class="single-column"></div>
    </section>
  </main>

  <footer class="border-t border-[var(--line)]">
    <div class="max-w-[var(--maxw)] mx-auto px-6 sm:px-10 py-12 flex flex-col sm:flex-row items-center justify-between gap-4">
      <p class="text-xs tracking-wide-2 uppercase text-[var(--muted)]">&copy; <span data-year="2024"></span> <span data-author></span></p>
      <p class="text-xs tracking-wide-2 uppercase text-[var(--muted)]">LucaLiu Photography</p>
    </div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/lightbox.js"></script>
  <script src="js/app.js"></script>
  <script src="js/stream.js"></script>
</body>
</html>
