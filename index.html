<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LucaLiu Photography</title>
  <meta name="description" content="LucaLiu Photography — a quiet collection of light, silence, and the in-between moments." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23F4F3EF'/><text x='16' y='22' font-family='Georgia,serif' font-size='18' fill='%232B2B28' text-anchor='middle'>L</text></svg>" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: {
        colors: { paper:'#F4F3EF','paper-2':'#ECEAE4', ink:'#2B2B28', muted:'#9A9A92', line:'#E0DED8' },
        fontFamily: { display:['Cormorant Garamond','serif'], body:['Inter','sans-serif'] }
      } }
    };
  </script>
  <link rel="stylesheet" href="css/style.css?v=4" />
</head>
<body class="font-body">

  <!-- 川内风格首页：左侧侧边栏（导航+系列列表）+ 右侧全屏大图 -->
  <div class="home-layout">
    <!-- 左侧侧边栏 -->
    <aside class="home-sidebar">
      <a href="index.html" class="home-brand">LucaLiu Photography</a>

      <!-- 主导航 -->
      <nav class="home-nav" style="display:flex !important;">
        <a href="works.html" data-nav="works">Works</a>
        <a href="stream.html" data-nav="stream">Stream</a>
        <a href="about.html" data-nav="about">About</a>
      </nav>

      <!-- 填充空间 -->
      <div class="home-sidebar-spacer"></div>

      <!-- 底部 -->
      <div class="home-sidebar-footer">
        <span class="home-lang">EN / CN</span>
        <span class="home-copy">&copy; <span data-year></span> Luca Liu</span>
      </div>
    </aside>

    <!-- 汉堡按钮（移动端，已隐藏） -->
    <button class="sidebar-toggle" data-sidebar-toggle aria-label="Toggle menu" style="display:none">Menu</button>

    <!-- 右侧全屏展示 -->
    <main class="home-stage">
      <!-- 大图容器 -->
      <div class="home-stage-img-wrap">
        <img id="home-stage-img" class="home-stage-img" alt="" />
        <img id="home-stage-img-overlay" class="home-stage-img overlay" alt="" />
      </div>

      <!-- 图片信息（左下角，半透明背景） -->
      <div class="home-stage-info">
        <div class="home-series-title" id="home-series-title">—</div>
        <div class="home-series-year" id="home-series-year"></div>
      </div>

      <!-- 左右切换箭头 -->
      <button class="home-arrow home-prev" id="home-prev" aria-label="Previous">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <button class="home-arrow home-next" id="home-next" aria-label="Next">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M9 6l6 6-6 6"/></svg>
      </button>
    </main>
  </div>

  <script src="js/data.js?v=3"></script>
  <script src="js/lightbox.js?v=3"></script>
  <script src="js/app.js?v=3"></script>
  <script src="js/home.js?v=3"></script>
</body>
</html>
