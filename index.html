<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LucaLiu Photography</title>
  <meta name="description" content="LucaLiu Photography — a quiet collection of light, silence, and the in-between moments." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23FAFAF7'/><text x='16' y='22' font-family='Georgia,serif' font-size='18' fill='%232B2B28' text-anchor='middle'>L</text></svg>" />

  <!-- Tailwind CSS（零构建，CDN 引入；便于 AI 后续直接改 class 迭代） -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            paper: '#FAFAF7', 'paper-2': '#F3F2EE', ink: '#2B2B28', muted: '#9A9A92', line: '#E7E5DF'
          },
          fontFamily: { display: ['Jost','Inter','sans-serif'], body: ['Inter','sans-serif'] }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="font-body">

  <!-- ============ 顶部导航 ============ -->
  <header class="site-header">
    <div class="max-w-[var(--maxw)] mx-auto px-6 sm:px-10">
      <div class="flex items-center justify-between h-20">
        <a href="index.html" class="font-display tracking-wide-2 text-sm">
          <span class="block leading-none">LUCA LIU</span>
          <span class="block text-[10px] tracking-wide-3 text-muted mt-1">PHOTOGRAPHY</span>
        </a>
        <nav class="hidden sm:flex items-center gap-10 text-xs tracking-wide-2 uppercase">
          <a href="index.html"   data-nav="home"    class="link-quiet">Home</a>
          <a href="gallery.html" data-nav="gallery" class="link-quiet">Gallery</a>
          <a href="about.html"   data-nav="about"   class="link-quiet">About</a>
        </nav>
        <button class="sm:hidden text-xl" data-menu-toggle aria-label="Menu">&#9776;</button>
      </div>
      <div class="mobile-menu sm:hidden" data-mobile-menu>
        <nav class="flex flex-col gap-5 pb-6 text-xs tracking-wide-2 uppercase">
          <a href="index.html"   data-nav="home"    class="link-quiet">Home</a>
          <a href="gallery.html" data-nav="gallery" class="link-quiet">Gallery</a>
          <a href="about.html"   data-nav="about"   class="link-quiet">About</a>
        </nav>
      </div>
    </div>
  </header>

  <main>
    <!-- ============ 首屏：极简引言 ============ -->
    <section class="section-breathe text-center px-6">
      <p class="reveal text-xs tracking-wide-3 uppercase text-muted">Photography</p>
      <h1 class="reveal title text-5xl sm:text-7xl mt-7">LucaLiu</h1>
      <p class="reveal max-w-md mx-auto mt-7 text-muted leading-relaxed">
        A quiet collection of light, silence, and the in-between moments.
      </p>
    </section>

    <!-- ============ 精选作品（纵向堆叠，留白充足） ============ -->
    <section class="pb-24">
      <div id="featured" class="max-w-[1000px] mx-auto px-6 sm:px-10 flex flex-col gap-24 sm:gap-32"></div>
    </section>

    <!-- ============ 进入相册入口 ============ -->
    <div class="text-center pb-32 reveal">
      <a href="gallery.html" class="link-quiet text-xs tracking-wide-2 uppercase">View All Works</a>
    </div>
  </main>

  <!-- ============ 页脚版权 ============ -->
  <footer class="border-t border-[var(--line)]">
    <div class="max-w-[var(--maxw)] mx-auto px-6 sm:px-10 py-12 flex flex-col sm:flex-row items-center justify-between gap-4">
      <p class="text-xs tracking-wide-2 uppercase text-[var(--muted)]">&copy; <span data-year="2024"></span> <span data-author></span></p>
      <p class="text-xs tracking-wide-2 uppercase text-[var(--muted)]">LucaLiu Photography</p>
    </div>
  </footer>

  <!-- ============ 脚本（顺序固定：数据 → 灯箱 → 共享 → 页面） ============ -->
  <script src="js/data.js"></script>
  <script src="js/lightbox.js"></script>
  <script src="js/app.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
