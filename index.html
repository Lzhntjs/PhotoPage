<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LucaLiu Photography</title>
  <meta name="description" content="LucaLiu Photography — a quiet collection of light, silence, and the in-between moments." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23F4F3EF'/><text x='16' y='22' font-family='Georgia,serif' font-size='18' fill='%232B2B28' text-anchor='middle'>L</text></svg>" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: {
        colors: { paper:'#F4F3EF','paper-2':'#ECEAE4', ink:'#2B2B28', muted:'#9A9A92', line:'#E0DED8' },
        fontFamily: { display:['Cormorant Garamond','serif'], body:['Inter','sans-serif'] }
      } }
    };
  </script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="font-body">

  <header class="site-header">
    <div class="max-w-[var(--maxw)] mx-auto px-6 sm:px-10">
      <div class="flex items-center justify-between h-20">
        <a href="index.html" class="font-display tracking-wide-2 text-sm">
          <span class="block leading-none">LUCA LIU</span>
          <span class="block text-[10px] tracking-wide-3 text-muted mt-1">PHOTOGRAPHY</span>
        </a>
        <button class="menu-btn" data-menu-toggle aria-label="Open menu">Menu</button>
      </div>
    </div>
  </header>

  <!-- 川内风格全屏侧边栏 -->
  <div class="nav-overlay" aria-hidden="true"></div>
  <aside class="nav-drawer" aria-label="Site navigation">
    <button class="nav-close" aria-label="Close menu">Close</button>
    <nav>
      <a href="index.html"  data-nav="home">Home</a>
      <a href="works.html"  data-nav="works">Works</a>
      <a href="stream.html" data-nav="stream">Stream</a>
      <a href="about.html"  data-nav="about">About</a>
    </nav>
    <div class="nav-footer">LucaLiu Photography</div>
  </aside>

  <main>
    <!-- 首屏：极简引言 -->
    <section class="section-breathe text-center px-6">
      <p class="reveal text-xs tracking-wide-3 uppercase text-muted">Photography</p>
      <h1 class="reveal title text-6xl sm:text-8xl mt-7">LucaLiu</h1>
      <p class="reveal max-w-md mx-auto mt-7 text-muted leading-relaxed">
        A quiet collection of light, silence, and the in-between moments.
      </p>
    </section>

    <!-- 精选系列（满宽大图，川内风格） -->
    <section class="pb-24">
      <div id="featured" class="featured-list max-w-[var(--maxw)] mx-auto px-6 sm:px-10"></div>
    </section>

    <!-- 双模式入口 -->
    <section class="pb-32 px-6">
      <div class="max-w-[var(--maxw)] mx-auto grid sm:grid-cols-2 gap-px bg-[var(--line)] border border-[var(--line)]">
        <a href="works.html" class="mode-entry block bg-[var(--paper)] px-8 py-14 text-center">
          <p class="reveal title text-3xl sm:text-4xl">Works</p>
          <p class="reveal text-xs tracking-wide-2 uppercase text-muted mt-3">Browse by series</p>
        </a>
        <a href="stream.html" class="mode-entry block bg-[var(--paper)] px-8 py-14 text-center">
          <p class="reveal title text-3xl sm:text-4xl">Stream</p>
          <p class="reveal text-xs tracking-wide-2 uppercase text-muted mt-3">One continuous scroll</p>
        </a>
      </div>
    </section>
  </main>

  <footer class="border-t border-[var(--line)]">
    <div class="max-w-[var(--maxw)] mx-auto px-6 sm:px-10 py-12 flex flex-col sm:flex-row items-center justify-between gap-4">
      <p class="text-xs tracking-wide-2 uppercase text-[var(--muted)]">&copy; <span data-year="2024"></span> <span data-author></span></p>
      <p class="text-xs tracking-wide-2 uppercase text-[var(--muted)]">LucaLiu Photography</p>
    </div>
  </footer>

  <script src="js/data.js?v=2"></script>
  <script src="js/lightbox.js?v=2"></script>
  <script src="js/app.js?v=2"></script>
  <script src="js/home.js?v=2"></script>
</body>
</html>
